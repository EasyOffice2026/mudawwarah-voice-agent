services:
  - type: web
    name: mudawwarah-voice-agent
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: MDAWRA_API_URL
        value: https://mdawra-api.onrender.com/api
      - key: MDAWRA_TENANT
        value: mdawra
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: myfatoorah
      - key: MYFATOORAH_API_KEY
        sync: false
      - key: MYFATOORAH_BASE_URL
        value: https://api.myfatoorah.com
      - key: KITCHEN_WHATSAPP_NUMBER
        sync: false
